name: Get full PR diff

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  get-pr-diff:
    runs-on: ubuntu-latest

    steps:
      - id: diff
        uses: suzuki-shunsuke/pr-unified-diff-action@c932c1df5f577028d8ca05d2d3c0c059072d8821 # v0.0.1

      - name: Show full PR diff in logs
        run: |
          echo "===== FULL PR DIFF ====="
          cat "${{ steps.diff.outputs.diff_path }}"
          echo "===== END PR DIFF ====="
